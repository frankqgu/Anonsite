<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>all roads lead to quinn</title>
  <link rel="stylesheet" href="/style.css" />

  <style>
    /* Blank background for #me section */
    .me-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
      background: linear-gradient(to bottom, #000 0%, #010814 100%);
      display: none;
      /* hidden unless #me active */
    }

    .me-bg.active {
      display: block;
    }

    #app {
      position: relative;
      z-index: 10;
    }

    /* Heart canvas styling */
    #heart-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>

<body>
  <!-- Blank Background (no rain / no clouds) -->
  <div class="me-bg" id="me-bg">
    <canvas id="heart-canvas"></canvas>
  </div>

  <!-- Main App -->
  <div id="app"></div>
  <div id="falling-container"></div>

  <!-- Load the unified JS (routing + animations) -->
  <script type="module" src="/main.js"></script>
</body>

</html>
